# lyrics-tool Configuration File
# Save as config.yaml and use with --config flag

# Processor settings (for lyricsooo-cook)
processor:
  # Maximum duration for a single phrase (seconds)
  # Phrases longer than this will be split at natural boundaries
  max_phrase_duration: 2.5
  
  # Minimum duration for a phrase (seconds)
  # Phrases shorter than this are skipped (likely timing errors)
  min_phrase_duration: 0.3
  
  # Maximum words per phrase (soft limit)
  # Used in combination with duration to decide when to split
  max_words_per_phrase: 8
  
  # Always split phrases at commas
  # When true, any phrase with commas will be split there
  split_on_commas: true
  
  # Use librosa for audio onset detection (requires librosa installed)
  # Provides more accurate word-level timing but slower
  use_onset_detection: false
  
  # Blend factor for onset detection (0.0 = even distribution, 1.0 = pure onset detection)
  # Only used if use_onset_detection is true
  onset_blend_factor: 0.5

# Visualizer settings (for lyricsooo)
visualizer:
  # Default font to use ('block' or 'compact')
  default_font: "block"
  
  # Display refresh rate (seconds)
  # How often to check playback position and update display
  refresh_rate: 0.05
  
  # Minimum time to display each word (seconds)
  # Only used for word-level (WLRC) display
  word_display_time: 0.3
  
  # Transition style ('fade', 'instant', 'scroll')
  # Note: Only 'instant' is currently implemented
  transition_style: "instant"
  
  # Enable terminal colors (not yet implemented)
  colors_enabled: true
  
  # Clear screen between updates
  clear_screen: true

# Colour source (for lyricsooo) — where the lyric tint and the now-playing
# card colours come from. This is what keeps the tool portable: the default
# works everywhere, and desktop-integrated presets are opt-in.
theme:
  # One of:
  #   art        - dominant colour of the album art          (default, portable)
  #   none       - no colour; terminal default foreground
  #   pywal      - follow ~/.cache/wal/colors.json           (wal / pywal)
  #   caelestia  - follow the Caelestia desktop scheme        (Material-You)
  #   matugen    - follow ~/.cache/matugen/colors.json
  #   fixed:#RRGGBB  - a single static accent colour
  #   file:PATH  - follow ANY JSON theme file (see keys below)
  color_source: "art"

  # For 'file:' (or to override a preset) point at a JSON palette and map
  # dotted key paths from its root to each colour. Leave null to use the
  # preset's own mapping. Example for a Material-You style file:
  #   theme_file: "~/.cache/matugen/colors.json"
  #   lyric_key:   "colors.primary"
  #   card_bg_key: "colors.surface_container_high"
  #   card_fg_key: "colors.on_surface"
  theme_file: null
  lyric_key: null
  card_bg_key: null
  card_fg_key: null


# Example usage:
# 
# lyricsooo-cook --config config.yaml --lrc-dir ~/Lyrics --audio-dir ~/Music --output-dir ~/Processed
# lyricsooo --config config.yaml --lrc-dir ~/Lyrics
#
# You can also override specific settings via command line:
# lyricsooo-cook --config config.yaml --max-phrase-duration 3.0 --lrc-dir ~/Lyrics ...
